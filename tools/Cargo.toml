[package]
name = "tools"
version = "0.9.0"
authors = ["Manos Pitsidianakis <manos@pitsidianak.is>"]
edition = "2021"
rust-version = "1.88.0"
license = "GPL-3.0-or-later"
homepage = "https://meli-email.org"
repository = "https://git.meli-email.org/meli/meli.git"
publish = false

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "emailparse"
path = "src/email_parse.rs"

[[bin]]
name = "mboxparse"
path = "src/mboxparse.rs"

[[bin]]
name = "embedded"
path = "src/embedded.rs"

[[bin]]
name = "linebreak"
path = "src/linebreak.rs"

[dependencies]
crossbeam = { version = "^0.8" }
meli = { path = "../meli", version = "0.9", default-features = false }
melib = { path = "../melib", version = "0.9", default-features = false }
nix = { version = "0.30", default-features = false, features = ["signal", "poll", "term", "ioctl", "process"] }
signal-hook = { version = "^0.3", default-features = false, features = ["iterator"] }
signal-hook-registry = { version = "1.2.0", default-features = false }
