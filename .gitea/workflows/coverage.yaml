# SPDX-License-Identifier: EUPL-1.2
name: Generate coverage HTML report

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  RUSTFLAGS: "-D warnings -W unreachable-pub -W rust-2021-compatibility"
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

on:
  workflow_dispatch:
  schedule:
      - cron: '0 3 * * SUN'

jobs:
  build:
    name: Generate coverage HTML report
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        build: [linux-amd64, ]
        include:
          - build: linux-amd64
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-gnu
            artifact_name: 'meli-linux-amd64'
    steps:
      - uses: actions/checkout@v3
      - id: os-deps
        name: install OS build dependencies
        run: |
          apt-get update
          apt-get install -y libdbus-1-dev pkg-config mandoc libssl-dev clang nettle-dev capnproto libsqlite3-dev
      - name: Restore rustup and grcov from cache (non-default branch only)
        id: cache-rustup
        if: forgejo.ref != 'refs/heads/master'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.rustup/
            ~/.cargo/env
            ~/.cargo/config.toml
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: coverage-workflow-${{ matrix.build }}-rustup
      - id: rustup-setup
        name: Install rustup, toolchains and llvm-tools
        if: steps.cache-rustup.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail "https://sh.rustup.rs" | sh -s -- --default-toolchain none -y
            source "${HOME}/.cargo/env"
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> $GITHUB_PATH
            echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> $GITHUB_ENV
            rustup toolchain install --profile minimal ${{ matrix.rust }} --target ${{ matrix.target }}
            rustup component add llvm-tools
          fi
      - name: Setup Rust target
        run: |
          mkdir -p "${{ env.CARGO_HOME }}"
          cat << EOF > "${{ env.CARGO_HOME }}"/config.toml
          [build]
          target = "${{ matrix.target }}"
          EOF
      - name: Install grcov dependency
        if: steps.cache-rustup.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --locked --target "${{ matrix.target }}" grcov
      - name: Run instrumented tests
        run: |
          export RUSTFLAGS="-Cinstrument-coverage"
          export LLVM_PROFILE_FILE="meli-%p-%m.profraw"
          make test
      - name: Generate HTML report
        run: |
          grcov . -s . --binary-path ./target/${{ matrix.target }}/debug/ -t html --branch --ignore-not-existing -o ./target/${{ matrix.target }}/debug/coverage/
          mv target/${{ matrix.target }}/debug/coverage artifacts
      - name: Save rustup to cache (default branch only)
        id: save-rustup-cache-deps
        uses: actions/cache/save@v6
        if: forgejo.ref == 'refs/heads/master'
        with:
          path: |
            ~/.rustup/
            ~/.cargo/env
            ~/.cargo/config.toml
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: coverage-workflow-${{ matrix.build }}-rustup
      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact_name }}_${{ env.FORGEJO_REF_NAME }}_grcov_coverage_html_report
          path: artifacts
          if-no-files-found: error
          retention-days: 7
